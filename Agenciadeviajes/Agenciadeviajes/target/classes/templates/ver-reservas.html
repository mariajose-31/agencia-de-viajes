<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Viajes Reservados - Viajaseguro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f4f4;
      margin: 0;
      padding: 0;
    }
    .container {
      max-width: 800px;
      margin: 20px auto;
      padding: 20px;
      background-color: white;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    }
    h1 {
      text-align: center;
      color: #333;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    th, td {
      padding: 10px;
      text-align: left;
      border-bottom: 1px solid #ddd;
    }
    th {
      background-color: #007BFF;
      color: white;
    }
    tr:hover {
      background-color: #f1f1f1;
    }
    .boton-salir {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      background-color: #007BFF;
      color: white;
      text-align: center;
      text-decoration: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .boton-salir:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>Viajes Reservados</h1>
  <table>
    <thead>
    <tr>
      <th>Origen</th>
      <th>Destino</th>
      <th>Fecha de Ida</th>
      <th>Fecha de Vuelta</th>
      <th>Pasajeros</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="reserva : ${reservas}">
      <td th:text="${reserva.origen}"></td>
      <td th:text="${reserva.destino}"></td>
      <td th:text="${reserva.fechaIda}"></td>
      <td th:text="${reserva.fechaVuelta}"></td>
      <td th:text="${reserva.pasajeros}"></td>
    </tr>
    </tbody>
  </table>

  <!-- Botón "Salir" -->
  <a href="/compra" class="boton-salir">Salir</a>
</div>
</body>
</html>
