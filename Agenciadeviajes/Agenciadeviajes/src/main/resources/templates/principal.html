<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bienvenidos - Viajaseguro</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background-image: url('https://wallpapers.com/images/featured-full/fondo-de-pantalla-de-avion-yms31u8wyuke7ari.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      color: white;
    }
    .container {
      text-align: center;
      width: 100%;
      max-width: 600px;
      padding: 20px;
      background-color: rgba(0, 0, 0, 0.7); /* Fondo semi-transparente para mejorar la legibilidad */
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    h1 {
      font-size: 28px;
      margin-bottom: 20px;
    }
    .options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .option-box {
      width: 150px;
      height: 100px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
    }
    .orange { background-color: #FFA500; }
    .red { background-color: #FF4500; }
    .green { background-color: #32CD32; }
    .blue { background-color: #0074D9; }
  </style>
</head>
<body>
<div class="container">
  <h1>Bienvenidos a la Agencia de Viajes Vuela Seguro</h1>
  <!-- Opciones en rectángulos -->
  <div class="options">
    <div class="option-box orange" onclick="window.location.href='/compra'">Hacer Compra</div>
  </div>
</div>
</body>
</html>
